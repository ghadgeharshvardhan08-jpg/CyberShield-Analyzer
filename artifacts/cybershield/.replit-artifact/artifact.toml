kind = "web"
previewPath = "/"
title = "CyberShield"
description = "An educational cybersecurity platform for preliminary URL threat analysis, private scan history, downloadable security reports, and practical learning modules."
version = "1.0.0"
id = "artifacts/cybershield"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19380

[services.development]
run = "pnpm --filter @workspace/cybershield run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cybershield", "run", "build" ]
serve = "static"
publicDir = "artifacts/cybershield/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19380"
BASE_PATH = "/"
